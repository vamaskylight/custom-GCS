name: tests

# CI gate for VGCS / DOOAF, on every push and PR.
#
# The unit test suite (`tests/`) is gitignored on purpose and is not in this repo, so a
# checkout here has no tests. This job checks what the repo does hold: every Python file
# compiles, and every vgcs module imports on a clean checkout (this catches a commit that
# is missing a file). The suite itself runs on the developer's machine. The last step runs
# it here as well, if `tests/` is ever committed.

on:
  push:
    branches: [master, main]
    # The APK (apk/) is C++ QGroundControl code and cannot affect the Python tests.
    paths-ignore:
      - "apk/**"
  pull_request:
    paths-ignore:
      - "apk/**"

jobs:
  pytest:
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 2026-10-19, and these steps were
    # checked on 24.04.
    runs-on: ubuntu-24.04
    env:
      # PySide6 (Qt) is imported by the map/observation mixins; run headless.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install system libs for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libgl1
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Compile every Python file
        run: python -m compileall -q .
      - name: Import every vgcs module
        run: python .github/scripts/import_check.py
      - name: Run tests
        run: |
          if [ -d tests ]; then
            pytest tests/ -q
          else
            echo "tests/ is not in this repo (gitignored, kept private). The suite runs on the developer's machine."
          fi
