# VAMA flight recorder settings (GPS-denied navigation, step 1).
# Lines that start with # are notes. Change a value, save, then restart the recorder:
#     sudo systemctl restart vama-recorder

[link]
# The flight controller's serial port as the Raspberry Pi sees it. GPIO 14 and 15 are /dev/serial0.
device = /dev/serial0
# The same speed as SERIALn_BAUD on the flight controller (115 there is 115200 here, 921 is 921600).
baud = 115200

[camera]
# Seconds between two pictures.
interval_s = 1.0
# full: the camera's whole picture. Or width x height, for example 2304x1296.
size = full
# JPEG quality, 50 to 100.
jpeg_quality = 92
# far: focus fixed at far (Camera Module 3). auto: the camera focuses by itself.
# none: a camera without focus control (HQ, Global Shutter).
focus = far
# 0: the camera sets the exposure by itself. Or a fixed exposure in microseconds, for example 1000.
exposure_us = 0
# The gain with a fixed exposure, 1.0 to 16.0. Not used when exposure_us is 0.
gain = 1.0
# How the camera is turned on the drone, in degrees clockwise: 0 when the top of the picture
# points to the drone's nose, 90 when it points to its right side. Only written down with the flight.
mount_yaw_deg = 0

[recording]
# Where the flights are saved (~ is the home folder of the user that runs the recorder).
folder = ~/vama-flights
# Pictures are taken while the drone is armed and from this height above home, in metres.
# 0: as soon as it is armed.
start_height_m = 30
# The recorder stops taking pictures when the card has less free space than this, in MB.
min_free_mb = 2000
